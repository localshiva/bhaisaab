# Git hooks, installed by `lefthook install` on pnpm install.
# Docs: https://lefthook.dev

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "src/**/*.{ts,tsx}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: format
      glob: "*.{ts,tsx,md}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: check-types
      glob: "*.{ts,tsx}"
      run: pnpm run check-types

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
